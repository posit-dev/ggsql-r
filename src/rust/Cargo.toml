[workspace]

[package]
name = 'ggsql-r'
publish = false
version = '0.5.2'
edition = '2021'
rust-version = '1.86'

[lib]
crate-type = ['staticlib']
name = 'ggsql'

[dependencies]
extendr-api = '0.8.2'
ggsql = { version = "0.5.2", default-features = false, features = ["duckdb", "odbc", "vegalite", "builtin-data", "svg", "pdf", "hep"] }
arrow = { version = "58", default-features = false, features = ["ipc"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
